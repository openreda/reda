[package]
name = "reda-cli"
description = "The `reda` command-line binary: MCP server, Command runner and bridge client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "reda"
path = "src/main.rs"

[dependencies]
reda-control = { path = "../reda-control" }
reda-engine = { path = "../reda-engine" }
rmcp.workspace = true
serde_json.workspace = true
trash.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "sync"] }

[dev-dependencies]
reda-testkit = { path = "../reda-testkit" }
schemars.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["io-util", "time"] }

[lints]
workspace = true
