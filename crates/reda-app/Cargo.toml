[package]
name = "reda-app"
description = "The REDA GUI binary: hands the OS trash and installed fonts to the engine and runs the window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# Shares the CLI's build script, so `reda-app --version` and `reda --version` always agree.
build = "../reda-cli/build.rs"

[[bin]]
name = "reda-app"
path = "src/main.rs"

[dependencies]
reda-ui = { path = "../reda-ui" }
trash.workspace = true

[lints]
workspace = true
