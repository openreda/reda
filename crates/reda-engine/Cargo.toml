[package]
name = "reda-engine"
description = "The headless entry point: Project open/save, cross-Document Commands, registry assembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
reda-command = { path = "../reda-command" }
reda-import-kicad = { path = "../reda-import-kicad" }
reda-library = { path = "../reda-library" }
reda-model = { path = "../reda-model" }
reda-output = { path = "../reda-output" }
reda-pcb = { path = "../reda-pcb" }
reda-render = { path = "../reda-render" }
reda-schematic = { path = "../reda-schematic" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true

# Finding the platform's per-user folders. A browser build has none.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories.workspace = true
# The canvas renderer behind `document.render`. wgpu stays out of the browser build.
reda-render = { path = "../reda-render", features = ["gpu"] }

[dev-dependencies]
proptest.workspace = true
reda-testkit = { path = "../reda-testkit" }

[lints]
workspace = true
