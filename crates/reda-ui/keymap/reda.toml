# Part tabs.

[[bind]]
context = "part"
key = "Mod+S"
command = "library.element.save"
params = { element = "$active_document" }

# Cycle the idle canvas stack.
[[bind]]
key = "Shift+Tab"
command = "selection.cycle"
params = { document = "$active_document" }

[[bind]]
context = "pcb"
key = "Mod+A"
command = "selection.set"
params = { objects = "$selectable" }

# Cross-select: Mod+Shift+X switches it, Mod+Shift+R its Reposition Preference.

[[bind]]
key = "Mod+Shift+X"
command = "view.cross_select.toggle"

[[bind]]
key = "Mod+Shift+R"
command = "view.cross_select.reposition.toggle"

# Cross-probe: Mod+Shift+C finds the selection on the other side.

[[bind]]
key = "Mod+Shift+C"
context = "schematic"
command = "view.cross_probe"
params = { objects = "$selection" }

[[bind]]
key = "Mod+Shift+C"
context = "pcb"
command = "view.cross_probe"
params = { objects = "$selection" }
