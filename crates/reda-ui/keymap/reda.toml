[[bind]]
context = "schematic"
key = "Insert"
command = "tool.insert_vertex"

[[bind]]
context = "tool:break_wire"
key = "Space"
command = "tool.cycle_cutting_length"

[[bind]]
context = "tool:break_wire"
key = "Tab"
command = "tool.edit_properties"

