[[bind]]
context = "pcb"
key = "U"
command = "pcb.selection.connected"

# Selecting and clearing copper with no Tool in flight: Tab widens a copper selection
# (contiguous Track on its Layer, connected copper, the whole Net, back to the start),
# Backspace unwinds one selected end Track or Via (deletes it and selects its neighbour)
# and Mod+Del unwinds both ways.

[[bind]]
context = "pcb"
key = "Backspace"
command = "pcb.copper.unwind"
params = { objects = "$selection" }

[[bind]]
context = "pcb"
key = "Mod+Del"
command = "pcb.copper.unwind"
params = { objects = "$selection", both = true }

# Dragging copper (the `drag` context, while a Track, Track end, Via or Free Pad drag is
