# The wiring Tools. A Wire run fixes a corner per click (or Enter) and ends on a Pin or
# Wire; Space or `/` turns its corner the other way, Shift+Space cycles the Wire mode
# (90°, 45°, Any Angle, Auto Wire), Insert adds a vertex, Backspace or Del takes its last
# segment off and Tab opens the Auto Wire options. Esc ends a run and stays in the Tool;
# another Tool started during a run returns to it on Esc. The other Tools place one object
# per click until Esc.

[[bind]]
context = "schematic"
key = "W"
command = "tool.activate:wire"

[[bind]]
context = "schematic"
key = "N"
command = "tool.activate:net_label"

[[bind]]
context = "schematic"
key = "P"
command = "tool.activate:port"

[[bind]]
context = "schematic"
key = "B"
command = "tool.activate:power_port"

[[bind]]
context = "schematic"
key = "Q"
command = "tool.activate:no_connect"

[[bind]]
context = "tool:wire"
key = "/"
command = "tool.cycle_corner"

[[bind]]
context = "tool:wire"
key = "Backspace"
command = "tool.undo_segment"

[[bind]]
context = "tool:wire"
key = "Space"
command = "tool.cycle_corner"

[[bind]]
context = "tool:wire"
key = "Shift+Space"
command = "tool.cycle_wire_mode"

[[bind]]
context = "tool:wire"
key = "Del"
command = "tool.undo_segment"

[[bind]]
context = "tool:wire"
key = "Insert"
command = "tool.insert_vertex"

[[bind]]
context = "tool:wire"
key = "Enter"
command = "tool.finish"

[[bind]]
context = "tool:wire"
key = "Tab"
command = "tool.edit_properties"

# Editing a placed Wire: Insert while holding a segment's handle adds a vertex (Del while
