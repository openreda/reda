[package]
name = "reda-ui"
description = "The window shell, the Start page, Document canvases and the UI string catalogue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui_extras.workspace = true
fluent-bundle.workspace = true
reda-control = { path = "../reda-control" }
reda-engine = { path = "../reda-engine" }
rfd.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# The font reader egui itself uses: validates a font file before egui gets it.
skrifa.workspace = true
toml_edit.workspace = true
# Read physical keypad location before egui translates a digit.
winit.workspace = true
unic-langid.workspace = true

# The OS reduced-motion read (theme/motion/system.rs), one platform each; versions and
# features are in the workspace. No `unsafe` is written for it.
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
reda-testkit = { path = "../reda-testkit" }

[lints]
workspace = true
