[package]
name = "reda-ui"
description = "The window shell, the Start page, Document canvases and the UI string catalogue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui_extras.workspace = true
fluent-bundle.workspace = true
reda-control = { path = "../reda-control" }
reda-engine = { path = "../reda-engine" }
rfd.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# The font reader egui itself uses: validates a font file before egui gets it.
skrifa.workspace = true
toml_edit.workspace = true
unic-langid.workspace = true

# The system window menu on a right-click in the Title bar: winit's own call, which egui
# has no command for (title_bar/wayland.rs, title_bar/windows.rs). The same winit eframe
# opens the window with.
[target.'cfg(any(target_os = "windows", all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android")))))'.dependencies]
winit.workspace = true

# The OS reduced-motion read (theme/motion/system.rs), one platform each. Every crate is
# already in Cargo.lock through eframe, wgpu-hal or AccessKit; these name the features the
# read needs, and no `unsafe` is written for it.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["UI_ViewManagement", "Foundation"] }

[dev-dependencies]
egui_kittest.workspace = true
reda-testkit = { path = "../reda-testkit" }

[lints]
workspace = true
