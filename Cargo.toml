[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/openreda/reda"
publish = false

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
schemars = "1.2.3"
proptest = { version = "1.12", default-features = false, features = ["std"] }
# The font crates follow the versions egui uses, so the binary carries one copy of each.
# harfrust and skrifa must share one read-fonts: harfrust 0.12 pairs with skrifa 0.44.
harfrust = "=0.12.0"
skrifa = "=0.44.0"
i_triangle = "0.51"
# Polygon booleans and offsets for Zone fill (reda-pcb), on the i64 nm engine.
i_overlay = "9.1"
# The spatial index behind PCB copper connectivity and clearance queries (reda-pcb).
rstar = "0.13"
toml_edit = "0.25"
# The Output Job zip (reda-output). Default features pull in aes/bzip2/lzma/zstd and C code;
# pure-Rust deflate is all a fab zip needs, and it builds on wasm.
zip = { version = "9.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
directories = "6"
# MCP: only reda-cli uses these (it is the only crate that depends on rmcp).
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io"] }
tokio = "1.52"
# The control-port token: 256 bits from the OS random source (reda-control).
getrandom = "0.4"
# Deleted Documents' files go to the OS trash on save (reda-control's OsTrash, which the
# app and the CLI hand their engines). MIT.
trash = { version = "5.2", default-features = false, features = ["coinit_apartmentthreaded"] }
# The canvas renderer (reda-render's `gpu` feature). wgpu must equal egui-wgpu's (0.37 uses
# 30.0); png encodes `document.render` output.
wgpu = "30.0.1"
png = "0.18.1"
# The window and UI (reda-ui, reda-app): egui/eframe/egui-wgpu move together, and egui-wgpu
# 0.37 is built on wgpu 30, the version above. eframe's glow backend stays off (ADR-0010).
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "accesskit", "default_fonts", "wayland", "x11", "clipboard", "links"] }
egui-wgpu = "0.37"
# SVG icons, rendered by resvg through egui's image loaders.
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
# Native file dialogs (xdg-portal on Linux, no GTK).
rfd = "0.17"
# The UI's string catalogue.
fluent-bundle = "0.16"
unic-langid = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
