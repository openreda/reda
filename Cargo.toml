[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/openreda/reda"
publish = false

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
schemars = "1.2.3"
proptest = { version = "1.12", default-features = false, features = ["std"] }
# The font crates follow the versions egui uses, so the binary carries one copy of each.
# harfrust and skrifa must share one read-fonts: harfrust 0.12 pairs with skrifa 0.44.
harfrust = "=0.12.0"
skrifa = "=0.44.0"
i_triangle = "0.51"
toml_edit = "0.25"
directories = "6"
# MCP: only reda-cli uses these (it is the only crate that depends on rmcp).
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io"] }
tokio = "1.52"
# The control-port token: 256 bits from the OS random source (reda-control).
getrandom = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
