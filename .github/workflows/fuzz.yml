# Weekly fuzzing of file loading, the KiCad import reader and the STEP reader
# (docs/spec/v0.1/quality-and-release.md#testing, docs/spec/v0.3/step.md).
# Scheduled and manual only: it never runs on pull requests, so it never gates a merge.
# A crash uploads the failing inputs; reproduce one with
#   cargo +nightly fuzz run <target> fuzz/artifacts/<target>/<crash file>
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  load_project:
    name: fuzz load_project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo-fuzz needs nightly; the pinned toolchain stays the default elsewhere.
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz for 20 minutes
        working-directory: fuzz
        run: |
          mkdir -p corpus/load_project
          cargo +nightly fuzz run load_project corpus/load_project seeds/load_project -- -max_total_time=1200
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  import_kicad:
    name: fuzz import_kicad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz for 20 minutes
        working-directory: fuzz
        run: |
          mkdir -p corpus/import_kicad
          cargo +nightly fuzz run import_kicad corpus/import_kicad seeds/import_kicad -- -max_total_time=1200
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-import_kicad
          path: fuzz/artifacts

  read_step:
    name: fuzz read_step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz for 20 minutes
        working-directory: fuzz
        run: |
          mkdir -p corpus/read_step
          cargo +nightly fuzz run read_step corpus/read_step ../crates/reda-step/tests/fixtures -- -max_total_time=1200
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-read_step
          path: fuzz/artifacts
